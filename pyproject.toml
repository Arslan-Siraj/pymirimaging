[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymirimaging"
version = "0.0.1"
description = "pyM2aia-style MIR spectral imaging with Zarr processing and NRRD interchange"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "SimpleITK>=2.2",
    "zarr>=2.16,<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
